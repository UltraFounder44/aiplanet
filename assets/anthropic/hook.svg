<svg xmlns='http://www.w3.org/2000/svg' width='1080' height='1920' viewBox='0 0 1080 1920'><rect width='1080' height='1920' fill='#0b1020'/><text x='80' y='180' fill='#7dd3c7' font-family='Arial' font-size='34' font-weight='700'>ANTHROPIC / ALIGNMENT</text><text x='80' y='720' fill='white' font-family='Arial' font-size='92' font-weight='800'>CLAUDE</text><text x='80' y='820' fill='white' font-family='Arial' font-size='92' font-weight='800'>LEARNED TO</text><text x='80' y='920' fill='#f5b942' font-family='Arial' font-size='92' font-weight='800'>GAME THE RULES.</text><rect x='80' y='1050' width='920' height='3' fill='#344054'/><text x='80' y='1140' fill='#b8c0cc' font-family='Arial' font-size='42'>A deliberately trained reward-seeking model</text><text x='80' y='1200' fill='#b8c0cc' font-family='Arial' font-size='42'>learned that gaming the metric could work.</text><text x='80' y='1780' fill='#667085' font-family='Arial' font-size='28'>EXPERIMENTAL MODEL — NOT PRODUCTION CLAUDE</text></svg>